<!doctype html>
<!-- 1200×630 Open Graph image. Rendered by scripts/social/render.mjs. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Social image</title>
    <style>
      @font-face {
        font-family: "Archivo Variable";
        font-weight: 100 900;
        font-stretch: 62% 125%;
        src: url(../../node_modules/@fontsource-variable/archivo/files/archivo-latin-standard-normal.woff2)
          format("woff2-variations");
      }

      @font-face {
        font-family: "JetBrains Mono Variable";
        font-weight: 100 800;
        src: url(../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2)
          format("woff2-variations");
      }

      :root {
        --ink: #0b0c0a;
        --line: #454b40;
        --mute: #a3aa9c;
        --bone: #e8ebe3;
        --acid: #c4f82a;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        display: grid;
        grid-template-rows: auto 1fr auto;
        background: var(--ink);
        color: var(--bone);
        font-family: "Archivo Variable", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .label {
        font-family: "JetBrains Mono Variable", monospace;
        font-size: 15px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      /* Top bar, echoing the site header */
      .bar {
        display: grid;
        grid-template-columns: 1fr auto auto 1fr;
        gap: 48px;
        align-items: center;
        height: 76px;
        padding: 0 56px;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .brand svg {
        width: 34px;
        height: 34px;
      }

      .mute {
        color: var(--mute);
      }

      .acid {
        color: var(--acid);
      }

      .bar .status {
        justify-self: end;
      }

      /* Framed name block with crop marks */
      .frame {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        margin: 34px 56px 30px;
        padding: 0 8px;
      }

      .mark {
        position: absolute;
        width: 18px;
        height: 18px;
        color: var(--mute);
      }

      .mark::before,
      .mark::after {
        position: absolute;
        content: "";
        background: currentColor;
      }

      .mark::before {
        top: 50%;
        left: 0;
        width: 100%;
        height: 1px;
      }

      .mark::after {
        top: 0;
        left: 50%;
        width: 1px;
        height: 100%;
      }

      .tl {
        top: -9px;
        left: -9px;
      }
      .tr {
        top: -9px;
        right: -9px;
      }
      .bl {
        bottom: -9px;
        left: -9px;
      }
      .br {
        right: -9px;
        bottom: -9px;
      }

      .meta {
        display: flex;
        justify-content: space-between;
        margin-bottom: 18px;
      }

      h1 {
        font-size: 166px;
        font-weight: 900;
        font-stretch: 125%;
        line-height: 0.82;
        letter-spacing: -0.04em;
        text-transform: uppercase;
      }

      h1 span {
        display: block;
        white-space: nowrap;
      }

      .dot {
        display: inline-block;
        width: 0.18em;
        height: 0.18em;
        margin-left: 0.06em;
        background: var(--acid);
      }

      /* Acid strip, echoing the marquee */
      .strip {
        display: flex;
        gap: 22px;
        align-items: center;
        height: 72px;
        padding: 0 56px;
        overflow: hidden;
        background: var(--acid);
        color: var(--ink);
        font-size: 24px;
        font-weight: 800;
        font-stretch: 125%;
        white-space: nowrap;
        text-transform: uppercase;
      }

      .strip i {
        font-size: 18px;
        font-style: normal;
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <svg viewBox="0 0 50 50" aria-hidden="true">
          <path
            fill="currentColor"
            d="M24.7.478C11.1.478 0 11.578 0 25.178s11.1 24.7 24.7 24.7 24.7-11.1 24.7-24.7S38.3.478 24.7.478Zm-17.8 24.7c0-5.1 2.2-9.8 5.7-13 1.4-1.3 3.8-.9 4.8.8l6.2 10.7c.6 1 .6 2.2 0 3.2l-6.2 10.7c-1 1.8-3.4 2.1-4.9.7-3.4-3.4-5.6-8-5.6-13.1Zm25.1 12.2-6.2-10.7c-.6-1-.6-2.2 0-3.2l6.2-10.7c1-1.7 3.3-2.1 4.8-.8 3.5 3.2 5.7 7.9 5.7 13s-2.2 9.8-5.7 13c-1.5 1.6-3.8 1.2-4.8-.6Z"
          />
        </svg>
        <span class="label">Proffer.dev</span>
      </div>
      <span class="label mute">[ Front-End Developer ]</span>
      <span class="label mute">46.54°N / 87.39°W</span>
      <span class="label status">Status <span class="acid">&gt;&gt;&gt; Building</span></span>
    </header>

    <main class="frame">
      <span class="mark tl"></span>
      <span class="mark tr"></span>
      <span class="mark bl"></span>
      <span class="mark br"></span>
      <div class="meta label mute">
        <span>(JP—11)</span>
        <span>Marquette, MI</span>
        <span>Accessible / Performant / Expressive</span>
      </div>
      <h1>
        <span>Jacob</span>
        <span>Proffer<span class="dot"></span></span>
      </h1>
    </main>

    <footer class="strip">
      Accessibility <i>✱</i> Performance <i>✱</i> Motion <i>✱</i> Design Systems
      <i>✱</i> Astro <i>✱</i> TypeScript <i>✱</i> Tailwind CSS <i>✱</i>
    </footer>
  </body>
</html>
